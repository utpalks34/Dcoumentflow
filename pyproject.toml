[project]
name = "docflow"
version = "0.1.0"
description = "Confidence-routed invoice extraction service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Needed for evals/metrics.py: scipy.optimize.linear_sum_assignment (Hungarian
    # assignment for line-item F1, TR-EVAL-05) and scipy.stats (Wilson/Clopper-Pearson
    # intervals). BSD-3-Clause licensed, compatible with this project staying swappable.
    "scipy>=1.11",
    # Needed for tools/profile.py and evals/manifest.py: page count, text-layer
    # detection (pypdf text extraction), and PDF producer/creator metadata, with
    # no external binary dependency. BSD-3-Clause licensed.
    "pypdf>=4.0",
    # Needed for kaggle_dataset.py: one-off fetch of the public SROIE-datasetv2
    # Kaggle dataset into local cache for DEV-split sourcing (not committed;
    # see evals/datasets/raw/ handling in CLAUDE.md). Apache-2.0 licensed.
    "kagglehub>=1.0.2",
    # Needed for tools/synth.py: generates the DEV-clean synthetic invoice
    # PDFs. BSD-licensed (ReportLab Toolkit, open-source edition).
    "reportlab>=4.0,<5",
]

[project.scripts]
docflow = "docflow.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.108",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/docflow/core", "src/docflow/evals"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
